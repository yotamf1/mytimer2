<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050506">
<title>טיימר אימונים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050506; --panel:#111114; --panel-2:#1a1a1f; --edge:#26262c;
    --text:#F2F2ED; --text-dim:#8a8a92;
    --work:#FFB627; --rest:#2DD4BF; --alert:#EF4444; --ring-track:#1e1e24;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);overflow:hidden;}
  body{font-family:'Heebo',sans-serif; color:var(--text); display:flex; flex-direction:column; height:100vh; height:100dvh; user-select:none;}
  .hidden{display:none !important;}
  .digits{font-family:'JetBrains Mono',monospace; font-variant-numeric: tabular-nums;}

  /* ===== HOME (persistent list) ===== */
  #home{display:flex; flex-direction:column; height:100%; padding:calc(20px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); overflow-y:auto;}
  .header{margin-bottom:16px;}
  .header h1{font-size:22px; font-weight:800; margin:0; letter-spacing:-0.02em;}
  .header .sub{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .exlist{display:flex; flex-direction:column; gap:8px;}
  .exrow{
    display:flex; align-items:center; gap:10px;
    background:var(--panel); border:1px solid var(--edge); border-radius:14px; padding:10px 12px;
  }
  .exrow .exlabel{font-size:15px; font-weight:700; min-width:64px;}
  .stepper{display:flex; align-items:center; gap:8px; flex:1; justify-content:center;}
  .stepper button{
    width:30px;height:30px;border-radius:9px;border:1px solid var(--edge);
    background:var(--panel-2); color:var(--text); font-size:16px; font-weight:700;
    display:flex;align-items:center;justify-content:center; cursor:pointer;
  }
  .stepper .val{min-width:56px; text-align:center; font-size:15px; font-weight:700;}
  .del-btn{background:none; border:none; color:var(--text-dim); font-size:18px; width:28px; height:28px; cursor:pointer; flex-shrink:0;}
  .add-btn{
    margin-top:10px; background:var(--panel); border:1.5px dashed var(--edge); color:var(--text-dim);
    border-radius:14px; padding:12px; font-size:14px; font-weight:600; cursor:pointer;
  }
  .settings-block{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
  .settings-title{font-size:11px; color:var(--text-dim); font-weight:700; letter-spacing:.04em; margin-bottom:2px;}
  .yesno{display:flex; gap:8px;}
  .yesno button{flex:1; padding:10px; border-radius:12px; border:1px solid var(--edge); background:var(--panel); color:var(--text); font-size:13.5px; font-weight:700; cursor:pointer;}
  .yesno button.active{background:var(--work); color:#1a1200; border-color:var(--work);}
  .interval-row{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:10px 12px;}
  .interval-row label{font-size:12.5px; color:var(--text-dim); flex:1;}
  select{background:var(--panel-2); color:var(--text); border:1px solid var(--edge); border-radius:9px; font-size:13px; padding:6px 8px; font-family:inherit;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; background:var(--panel); border:1px solid var(--edge); border-radius:12px; padding:11px 14px; font-size:12.5px; color:var(--text-dim);}
  .switch{position:relative; width:40px; height:22px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .switch .slider{position:absolute; inset:0; background:var(--edge); border-radius:99px; transition:.15s;}
  .switch .slider:before{content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:var(--text); border-radius:50%; transition:.15s;}
  .switch input:checked + .slider{background:var(--work);}
  .switch input:checked + .slider:before{transform:translateX(-18px);}
  .start-btn{margin-top:18px; background:var(--work); color:#1a1200; border:none; border-radius:14px; padding:16px; font-size:17px; font-weight:800; cursor:pointer;}
  .start-btn:disabled{opacity:0.4;}

  /* ===== TIMER VIEW ===== */
  #timerView{display:flex; flex-direction:column; align-items:center; justify-content:space-between; height:100%;
    padding:calc(18px + env(safe-area-inset-top)) 20px calc(18px + env(safe-area-inset-bottom)); background:#000; transition:background .25s;}
  #timerView.flash{background:var(--alert);}
  .tv-top{width:100%; display:flex; align-items:center; justify-content:space-between;}
  .exit-btn{background:none; border:none; color:var(--text-dim); font-size:14px; cursor:pointer; padding:8px;}
  .mic-indicator{display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim); padding:6px 10px; border-radius:99px; border:1px solid var(--edge);}
  .mic-dot{width:7px;height:7px;border-radius:50%; background:var(--edge);}
  .mic-indicator.live .mic-dot{background:var(--rest); box-shadow:0 0 8px var(--rest);}
  .tv-center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;}
  .phase-label{font-size:13px; font-weight:700; letter-spacing:0.08em; padding:5px 14px; border-radius:99px; background:rgba(255,182,39,0.12); color:var(--work);}
  .phase-label.rest{background:rgba(45,212,191,0.12); color:var(--rest);}
  .phase-label.overtime{background:rgba(239,68,68,0.14); color:var(--alert);}
  .ring-wrap{position:relative; width:min(78vw,320px); height:min(78vw,320px); margin:18px 0;}
  .ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
  .ring-track{fill:none; stroke:var(--ring-track); stroke-width:5;}
  .ring-progress{fill:none; stroke:var(--work); stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .2s linear, stroke .3s;}
  .ring-progress.rest{stroke:var(--rest);}
  .ring-progress.overtime{stroke:var(--alert); animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.45;}}
  .ring-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;}
  .time-display{font-size:min(15vw,64px); font-weight:700; line-height:1;}
  .time-display.leadin{font-size:min(22vw,96px); color:var(--work);}
  .ex-name{font-size:16px; font-weight:600; color:var(--text-dim); text-align:center; max-width:260px;}
  .ex-progress{font-size:12px; color:var(--text-dim);}
  .tv-controls{width:100%; display:flex; flex-direction:column; gap:12px; align-items:center;}
  .main-controls{display:flex; align-items:center; justify-content:center; gap:18px;}
  .ctrl-btn{background:var(--panel); border:1px solid var(--edge); color:var(--text); border-radius:50%; width:56px; height:56px; font-size:18px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .ctrl-btn.play{width:76px; height:76px; background:var(--work); color:#1a1200; font-size:24px; border:none;}
  .ctrl-btn.play.ready{background:var(--rest);}
  .hint{font-size:11px; color:var(--text-dim); text-align:center; min-height:14px;}
  .dim-toggle{background:none; border:none; color:var(--text-dim); font-size:11px; text-decoration:underline; cursor:pointer;}
  #timerView.saver .tv-top, #timerView.saver .ex-name, #timerView.saver .ex-progress,
  #timerView.saver .phase-label, #timerView.saver .ring-track, #timerView.saver .hint{opacity:0.12;}
  #timerView.saver .main-controls{opacity:0.25;}
</style>
</head>
<body>

<!-- ============ HOME ============ -->
<div id="home">
  <div class="header">
    <h1>טיימר אימונים</h1>
    <div class="sub">קבע תרגילים, ולחץ התחלה</div>
  </div>

  <div class="exlist" id="exList"></div>
  <button class="add-btn" id="addExBtn">+ הוספת תרגיל</button>

  <div class="settings-block">
    <div class="settings-title">תזכורות באמצע התרגיל</div>
    <div class="yesno">
      <button id="alertsNo">לא</button>
      <button id="alertsYes">כן</button>
    </div>
    <div class="interval-row hidden" id="intervalRow">
      <label>כל כמה שניות</label>
      <div class="stepper" style="flex:0;">
        <button id="intervalMinus">–</button>
        <div class="val digits" id="intervalVal">10</div>
        <button id="intervalPlus">+</button>
      </div>
    </div>
    <div class="interval-row hidden" id="typeRow">
      <label>סוג התזכורת</label>
      <select id="alertTypeSelect">
        <option value="beep">ביפ</option>
        <option value="voice">קול - שניות שעברו</option>
        <option value="both">שניהם</option>
      </select>
    </div>
    <div class="toggle-row">
      <span>לולאה - חזרה לתרגיל הראשון בסיום</span>
      <label class="switch"><input type="checkbox" id="loopToggle" checked><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span>פקודות קוליות (עצור / התחל / הבא)</span>
      <label class="switch"><input type="checkbox" id="voiceToggle" checked><span class="slider"></span></label>
    </div>
  </div>

  <button class="start-btn" id="startBtn">התחלת אימון</button>
</div>

<!-- ============ TIMER VIEW ============ -->
<div id="timerView" class="hidden">
  <div class="tv-top">
    <button class="exit-btn" id="exitBtn">✕ סיום</button>
    <div class="mic-indicator" id="micIndicator"><span class="mic-dot"></span><span id="micText">מיקרופון כבוי</span></div>
  </div>

  <div class="tv-center">
    <div class="phase-label" id="phaseLabel">מוכן</div>
    <div class="ring-wrap">
      <svg viewBox="0 0 200 200">
        <circle class="ring-track" cx="100" cy="100" r="90"></circle>
        <circle class="ring-progress" id="ringProgress" cx="100" cy="100" r="90"></circle>
      </svg>
      <div class="ring-center">
        <div class="time-display digits" id="timeDisplay">00:00</div>
        <div class="ex-progress" id="exProgress">1 מתוך 3</div>
      </div>
    </div>
    <div class="ex-name" id="exName">תרגיל 1</div>
  </div>

  <div class="tv-controls">
    <div class="main-controls">
      <button class="ctrl-btn" id="skipBtn" title="דלג לתרגיל הבא">⏭</button>
      <button class="ctrl-btn play ready" id="playBtn">▶</button>
      <button class="ctrl-btn" id="restartBtn" title="אתחול תרגיל נוכחי">↺</button>
    </div>
    <div class="hint" id="hintText">גע במסך או הגד "התחל" כדי להתחיל</div>
    <button class="dim-toggle" id="saverToggle">מצב חיסכון בסוללה - עמעום מלא</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CONFIG_KEY = 'workout-timer-config-v3';
  var durations = [35,35,60];
  var alertsEnabled = false;
  var alertInterval = 10;
  var alertType = 'beep';
  var loopEnabled = true;
  var voiceEnabled = true;

  async function loadConfig(){
    try{
      var r = await window.storage.get(CONFIG_KEY, false);
      if(r && r.value){
        var c = JSON.parse(r.value);
        if(c.durations && c.durations.length) durations = c.durations.slice();
        if(typeof c.alertsEnabled === 'boolean') alertsEnabled = c.alertsEnabled;
        if(c.alertInterval) alertInterval = c.alertInterval;
        if(c.alertType) alertType = c.alertType;
        if(typeof c.loopEnabled === 'boolean') loopEnabled = c.loopEnabled;
        if(typeof c.voiceEnabled === 'boolean') voiceEnabled = c.voiceEnabled;
      }
    }catch(e){}
    renderHome();
  }
  function saveConfig(){
    try{
      window.storage.set(CONFIG_KEY, JSON.stringify({
        durations:durations, alertsEnabled:alertsEnabled, alertInterval:alertInterval,
        alertType:alertType, loopEnabled:loopEnabled, voiceEnabled:voiceEnabled
      }), false);
    }catch(e){}
  }

  // ---------- HOME rendering ----------
  var exListEl = document.getElementById('exList');
  var startBtnEl = document.getElementById('startBtn');

  function renderHome(){
    exListEl.innerHTML = '';
    durations.forEach(function(d, i){ exListEl.appendChild(buildExRow(i)); });
    startBtnEl.disabled = durations.length === 0;
    document.getElementById('alertsYes').classList.toggle('active', alertsEnabled);
    document.getElementById('alertsNo').classList.toggle('active', !alertsEnabled);
    document.getElementById('intervalRow').classList.toggle('hidden', !alertsEnabled);
    document.getElementById('typeRow').classList.toggle('hidden', !alertsEnabled);
    document.getElementById('intervalVal').textContent = alertInterval;
    document.getElementById('alertTypeSelect').value = alertType;
    document.getElementById('loopToggle').checked = loopEnabled;
    document.getElementById('voiceToggle').checked = voiceEnabled;
  }

  function buildExRow(i){
    var row = document.createElement('div');
    row.className = 'exrow';
    var label = document.createElement('div');
    label.className = 'exlabel';
    label.textContent = 'תרגיל ' + (i+1);
    var stepper = document.createElement('div');
    stepper.className = 'stepper';
    var minus = document.createElement('button'); minus.textContent = '–';
    var val = document.createElement('div'); val.className = 'val digits';
    var plus = document.createElement('button'); plus.textContent = '+';
    function render(){ val.textContent = formatDur(durations[i]); }
    render();
    minus.onclick = function(){ durations[i] = Math.max(5, durations[i]-5); render(); saveConfig(); };
    plus.onclick = function(){ durations[i] = Math.min(1800, durations[i]+5); render(); saveConfig(); };
    stepper.appendChild(minus); stepper.appendChild(val); stepper.appendChild(plus);
    var del = document.createElement('button');
    del.className = 'del-btn'; del.textContent = '✕';
    del.onclick = function(){ durations.splice(i,1); saveConfig(); renderHome(); };
    row.appendChild(label); row.appendChild(stepper); row.appendChild(del);
    return row;
  }

  function formatDur(v){
    if(v < 60) return v + '"';
    var m = Math.floor(v/60), s = v%60;
    return m + ':' + (s<10?'0':'') + s;
  }

  document.getElementById('addExBtn').onclick = function(){
    durations.push(durations.length ? durations[durations.length-1] : 30);
    saveConfig(); renderHome();
  };
  document.getElementById('alertsYes').onclick = function(){ alertsEnabled = true; saveConfig(); renderHome(); };
  document.getElementById('alertsNo').onclick = function(){ alertsEnabled = false; saveConfig(); renderHome(); };
  document.getElementById('intervalMinus').onclick = function(){ alertInterval = Math.max(5, alertInterval-5); document.getElementById('intervalVal').textContent = alertInterval; saveConfig(); };
  document.getElementById('intervalPlus').onclick = function(){ alertInterval = Math.min(120, alertInterval+5); document.getElementById('intervalVal').textContent = alertInterval; saveConfig(); };
  document.getElementById('alertTypeSelect').onchange = function(e){ alertType = e.target.value; saveConfig(); };
  document.getElementById('loopToggle').onchange = function(e){ loopEnabled = e.target.checked; saveConfig(); };
  document.getElementById('voiceToggle').onchange = function(e){ voiceEnabled = e.target.checked; saveConfig(); };

  // ---------- audio ----------
  var audioCtx = null;
  var pendingBeepTimers = [];
  var micMuteUntil = 0;
  function ctx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }
  function beep(freq, duration, delay, type){
    delay = delay || 0;
    var t = setTimeout(function(){
      try{
        var c = ctx();
        var osc = c.createOscillator();
        var gain = c.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.001, c.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, c.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
        osc.connect(gain); gain.connect(c.destination);
        osc.start(); osc.stop(c.currentTime + duration + 0.05);
      }catch(e){}
    }, delay);
    pendingBeepTimers.push(t);
  }
  function clearPendingBeeps(){
    pendingBeepTimers.forEach(function(t){ clearTimeout(t); });
    pendingBeepTimers = [];
  }
  function muteMicBriefly(ms){ micMuteUntil = Date.now() + ms; }
  function intervalBeep(){ beep(880, 0.12, 0, 'sine'); muteMicBriefly(500); }
  function completionBeep(){
    // distinct 4-tone finishing signal, then silence - no more beeps until user acts
    beep(660, 0.14, 0, 'square');
    beep(880, 0.14, 170, 'square');
    beep(660, 0.14, 340, 'square');
    beep(990, 0.22, 510, 'square');
    muteMicBriefly(1000);
  }
  function leadInTick(){ beep(520, 0.09, 0, 'sine'); muteMicBriefly(400); }
  function goBeep(){ beep(1100, 0.16, 0, 'square'); muteMicBriefly(500); }
  function speak(text){
    try{
      if(!window.speechSynthesis) return;
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'he-IL'; u.rate = 1.02;
      muteMicBriefly(1200 + text.length*70);
      window.speechSynthesis.speak(u);
    }catch(e){}
  }

  // ---------- timer core ----------
  var home = document.getElementById('home');
  var timerView = document.getElementById('timerView');
  var timeDisplay = document.getElementById('timeDisplay');
  var exNameEl = document.getElementById('exName');
  var exProgressEl = document.getElementById('exProgress');
  var phaseLabel = document.getElementById('phaseLabel');
  var ringProgress = document.getElementById('ringProgress');
  var playBtn = document.getElementById('playBtn');
  var hintText = document.getElementById('hintText');
  var RING_CIRC = 2 * Math.PI * 90;
  ringProgress.style.strokeDasharray = RING_CIRC;

  var currentIndex = 0;
  var duration = 0;
  var phase = 'ready'; // ready | leadin | running
  var runStartTime = 0;
  var lastAlertMark = -1;
  var hasFiredCompletion = false;
  var tickHandle = null;
  var leadInHandle = null;
  var wakeLock = null;
  var lastSummary = '';

  async function requestWakeLock(){ try{ if('wakeLock' in navigator){ wakeLock = await navigator.wakeLock.request('screen'); } }catch(e){} }
  function releaseWakeLock(){ try{ if(wakeLock){ wakeLock.release(); wakeLock=null; } }catch(e){} }

  function formatTime(s){
    s = Math.max(0, Math.round(s));
    var m = Math.floor(s/60), sec = s%60;
    return m + ':' + (sec<10?'0':'') + sec;
  }

  document.getElementById('startBtn').onclick = function(){
    if(durations.length === 0) return;
    saveConfig();
    home.classList.add('hidden');
    timerView.classList.remove('hidden');
    requestWakeLock();
    enterReady(0);
    if(voiceEnabled) startVoiceRecognition();
  };

  function enterReady(index, summary){
    currentIndex = index;
    duration = durations[currentIndex];
    phase = 'ready';
    lastSummary = summary || '';
    timeDisplay.classList.remove('leadin');
    exNameEl.textContent = 'תרגיל ' + (currentIndex+1);
    exProgressEl.textContent = (currentIndex+1) + ' מתוך ' + durations.length;
    phaseLabel.textContent = 'מוכן להתחיל';
    phaseLabel.classList.add('rest'); phaseLabel.classList.remove('overtime');
    ringProgress.classList.add('rest'); ringProgress.classList.remove('overtime');
    playBtn.classList.add('ready'); playBtn.textContent = '▶';
    hintText.textContent = lastSummary ? (lastSummary + ' · גע או הגד "התחל"') : 'גע במסך או הגד "התחל" כדי להתחיל';
    timeDisplay.textContent = formatTime(duration);
    ringProgress.style.strokeDashoffset = 0;
  }

  function requestStart(){
    if(phase !== 'ready') return;
    phase = 'leadin';
    playBtn.classList.remove('ready');
    playBtn.textContent = '…';
    phaseLabel.textContent = 'מתכונן';
    phaseLabel.classList.remove('rest');
    ringProgress.classList.remove('rest');
    timeDisplay.classList.add('leadin');
    hintText.textContent = '';
    var n = 3;
    timeDisplay.textContent = String(n);
    leadInTick();
    leadInHandle = setInterval(function(){
      n--;
      if(n > 0){
        timeDisplay.textContent = String(n);
        leadInTick();
      } else {
        clearInterval(leadInHandle); leadInHandle = null;
        timeDisplay.classList.remove('leadin');
        goBeep();
        beginRun();
      }
    }, 800);
  }

  function beginRun(){
    phase = 'running';
    runStartTime = Date.now();
    lastAlertMark = -1;
    hasFiredCompletion = false;
    phaseLabel.textContent = 'תרגיל';
    playBtn.classList.remove('ready');
    playBtn.textContent = '■';
    hintText.textContent = 'הגד "עצור" או גע במסך לסיום התרגיל';
    tickHandle = setInterval(tick, 200);
    tick();
  }

  function tick(){
    var elapsed = (Date.now() - runStartTime)/1000;
    if(elapsed <= duration){
      var remaining = duration - elapsed;
      timeDisplay.textContent = formatTime(remaining);
      exProgressEl.textContent = (currentIndex+1) + ' מתוך ' + durations.length;
      var frac = duration > 0 ? (remaining/duration) : 0;
      ringProgress.style.strokeDashoffset = RING_CIRC * (1-frac);
      ringProgress.classList.remove('overtime');
      phaseLabel.classList.remove('overtime');
    } else {
      if(!hasFiredCompletion){
        hasFiredCompletion = true;
        completionBeep();
        flashScreen();
      }
      var over = elapsed - duration;
      timeDisplay.textContent = '+' + formatTime(over);
      phaseLabel.textContent = 'זמן נוסף';
      phaseLabel.classList.add('overtime');
      ringProgress.classList.add('overtime');
      ringProgress.style.strokeDashoffset = 0;
    }
    // periodic reminders only apply during the countdown itself, not during extra time
    if(alertsEnabled && alertInterval > 0 && elapsed <= duration){
      var mark = Math.floor(elapsed / alertInterval);
      if(mark > lastAlertMark && mark > 0){
        lastAlertMark = mark;
        var secondsPassed = mark * alertInterval;
        if(alertType === 'beep' || alertType === 'both') intervalBeep();
        if(alertType === 'voice' || alertType === 'both') speak(secondsPassed + ' שניות');
      }
    }
  }

  function flashScreen(){
    timerView.classList.add('flash');
    setTimeout(function(){ timerView.classList.remove('flash'); }, 260);
  }

  function clearTimers(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    if(leadInHandle){ clearInterval(leadInHandle); leadInHandle = null; }
    clearPendingBeeps();
    try{ if(window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  }

  function finalizeAndAdvance(){
    var elapsed = phase === 'running' ? (Date.now() - runStartTime)/1000 : 0;
    clearTimers();
    var summary = '';
    if(phase === 'running'){
      var over = elapsed - duration;
      summary = over > 0 ? ('תרגיל ' + (currentIndex+1) + ' הסתיים · +' + Math.round(over) + ' שנ׳') : ('תרגיל ' + (currentIndex+1) + ' הסתיים');
    }
    var next = currentIndex + 1;
    if(next >= durations.length){
      if(loopEnabled) enterReady(0, summary); else finishWorkout();
    } else {
      enterReady(next, summary);
    }
  }

  function stopCurrent(){
    if(phase === 'ready') return;
    finalizeAndAdvance();
  }

  function skipCurrent(){
    if(phase === 'ready'){
      clearTimers();
      var next = currentIndex + 1;
      if(next >= durations.length){ if(loopEnabled) enterReady(0); else finishWorkout(); }
      else enterReady(next);
      return;
    }
    finalizeAndAdvance();
  }

  function restartCurrent(){
    clearTimers();
    enterReady(currentIndex);
  }

  function togglePlay(){
    if(phase === 'ready') requestStart();
    else if(phase === 'running') stopCurrent();
    // during leadin: ignore taps to avoid accidental cancel
  }

  function finishWorkout(){
    clearTimers();
    stopVoiceRecognition();
    releaseWakeLock();
    timerView.classList.add('hidden');
    home.classList.remove('hidden');
    renderHome();
  }

  // ---------- voice control ----------
  var STOP_WORDS = ['עצור','תעצור','לעצור','עצירה','די','סטופ','stop'];
  var START_WORDS = ['התחל','תתחיל','להתחיל','התחלה','קדימה','סטארט','start','go'];
  var NEXT_WORDS = ['הבא','תדלג','לדלג','דלג','next','skip'];
  var recognizing = false;
  var recognition = null;

  function matchesAny(transcript, words){
    for(var i=0;i<words.length;i++){ if(transcript.indexOf(words[i]) !== -1) return true; }
    return false;
  }
  function startVoiceRecognition(){
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ document.getElementById('micText').textContent = 'קול לא נתמך בדפדפן זה'; return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      document.getElementById('micText').textContent = 'דפדפן זה חוסם גישה למיקרופון (נסה לפתוח ישירות בכרום)';
      return;
    }
    navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    }).then(function(stream){
      try{ stream.getTracks().forEach(function(t){ t.stop(); }); }catch(e){}
      recognizing = true;
      launchRecognizer(SR);
    }).catch(function(err){
      recognizing = false;
      document.getElementById('micText').textContent = 'אין הרשאת מיקרופון (' + (err && err.name ? err.name : 'שגיאה') + ')';
    });
  }

  function launchRecognizer(SR){
    try{
      recognition = new SR();
      recognition.lang = 'he-IL';
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.onresult = function(event){
        if(Date.now() < micMuteUntil) return; // ignore our own beeps/voice being picked up
        var last = event.results[event.results.length-1];
        var transcript = last[0].transcript.trim().toLowerCase();
        if(matchesAny(transcript, STOP_WORDS)) stopCurrent();
        else if(matchesAny(transcript, NEXT_WORDS)) skipCurrent();
        else if(matchesAny(transcript, START_WORDS)) requestStart();
      };
      recognition.onstart = function(){ setMicUI(true); };
      recognition.onend = function(){
        if(recognizing){
          setTimeout(function(){
            if(recognizing){ try{ recognition.start(); }catch(e){ setMicUI(false, 'לא ניתן להפעיל מיקרופון מחדש'); } }
          }, 300);
        } else { setMicUI(false); }
      };
      recognition.onerror = function(e){
        var reason = e && e.error ? e.error : 'שגיאה';
        if(reason === 'no-speech' || reason === 'aborted'){ return; }
        if(reason === 'not-allowed' || reason === 'service-not-allowed'){
          recognizing = false;
          setMicUI(false, 'הרשאת מיקרופון נדחתה');
          return;
        }
        setMicUI(false, 'שגיאת מיקרופון: ' + reason);
      };
      recognition.start();
      setMicUI(true);
    }catch(e){ document.getElementById('micText').textContent = 'לא ניתן להפעיל מיקרופון'; }
  }
  function stopVoiceRecognition(){
    recognizing = false; setMicUI(false);
    try{ if(recognition) recognition.stop(); }catch(e){}
  }
  function setMicUI(on, msg){
    var ind = document.getElementById('micIndicator');
    var txt = document.getElementById('micText');
    if(on){ ind.classList.add('live'); txt.textContent = 'מאזין - "עצור" / "התחל" / "הבא"'; }
    else{ ind.classList.remove('live'); txt.textContent = msg || 'מיקרופון כבוי'; }
  }

  // ---------- battery saver ----------
  document.getElementById('saverToggle').onclick = function(){ timerView.classList.toggle('saver'); };

  // ---------- controls ----------
  document.getElementById('exitBtn').onclick = finishWorkout;
  playBtn.onclick = togglePlay;
  document.getElementById('skipBtn').onclick = skipCurrent;
  document.getElementById('restartBtn').onclick = restartCurrent;
  document.querySelector('.tv-center').addEventListener('click', function(e){
    if(e.target.closest('.main-controls')) return;
    togglePlay();
  });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && !timerView.classList.contains('hidden')) requestWakeLock();
  });

  loadConfig();
})();
</script>
</body>
</html>
